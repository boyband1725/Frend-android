name: Deploy MYtrack AIS Radar

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push AIS secret and deploy protected function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$AISSTREAM_API_KEY"
          supabase secrets set AISSTREAM_API_KEY="$AISSTREAM_API_KEY" --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase functions deploy ais-radar --project-ref "$SUPABASE_PROJECT_REF" --yes
