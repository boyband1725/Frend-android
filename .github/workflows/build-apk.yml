name: Build MYtrack APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MYTRACK_VERSION_CODE: ${{ github.run_number }}
      MYTRACK_VERSION_NAME: 1.0.${{ github.run_number }}
      MYTRACK_KEYSTORE_PASSWORD: ${{ secrets.MYTRACK_KEYSTORE_PASSWORD }}
      MYTRACK_KEY_ALIAS: ${{ secrets.MYTRACK_KEY_ALIAS }}
      MYTRACK_KEY_PASSWORD: ${{ secrets.MYTRACK_KEY_PASSWORD }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore permanent signing key
        env:
          MYTRACK_KEYSTORE_BASE64: ${{ secrets.MYTRACK_KEYSTORE_BASE64 }}
        run: |
          test -n "$MYTRACK_KEYSTORE_BASE64" || (echo "Missing MYTRACK_KEYSTORE_BASE64 secret" && exit 1)
          mkdir -p "$RUNNER_TEMP/mytrack-signing"
          echo "$MYTRACK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mytrack-signing/mytrack-release.jks"
          echo "MYTRACK_KEYSTORE_FILE=$RUNNER_TEMP/mytrack-signing/mytrack-release.jks" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build signed APKs
        run: gradle assembleDebug assembleRelease
      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: MYtrack-v${{ env.MYTRACK_VERSION_NAME }}-signed-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
